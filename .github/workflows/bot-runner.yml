name: CinePorto Bot Runner

on:
  schedule:
    # Run periodically to process queued Telegram updates.
    # Note: GitHub Actions scheduled cron runs every 5-15 mins and only fires on the default branch.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "state.json"
      - "README.md"
      - "docs/**"

concurrency:
  group: cineporto-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CinePorto Bot (Batch Update Mode)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HTTP_TIMEOUT_SECONDS: "15"
          STATE_FILE: "state.json"
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Secret TELEGRAM_BOT_TOKEN is missing! Set it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python3 main.py --once

      - name: Persist update state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          if [ -f state.json ]; then
            git add state.json
            git diff --cached --quiet || (git commit -m "bot: update state.json [skip ci]" && git push)
          fi
